{% load static %}
<style>
  .init_popup {
    z-index: 100000;
    position: fixed;
    width: 100vw;
    top: 0px;
    left: 0px;
    font-family: Arial, sans-serif;
    background-color: #ffffff00;
    border: 20px;
    margin: 0;
    padding: 10px;
    display: block;
    align-items: center;
    justify-content: center;
    height: 100vh;
    display: none;
  }

  .cancel-buttonx {
    position: absolute;
    top: 0px;
    right: 0px;
    background-color: #f44336;
    color: white;
    border: none;
    border-top-right-radius: 30px;
    border-bottom-left-radius: 10px;
    width: 70px;
    height: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .cancel-buttonx:hover {
    background-color: #d32f2f;
  }

  .cancel-buttonx:active {
    background-color: #b71c1c;
    transform: scale(0.95);
  }

  .signup-containerx {
    position: sticky;
    width: 60vw;
    padding: 40px;
    background-color: rgb(213, 216, 219);
    border-radius: 30px;
    box-shadow: 0 4px 10px #00000033;
    text-align: center;
    transition: transform 0.3s ease, background-color 0.3s ease;
  }

  /* Active state for signup container */
  .signup-containerx.active {
    background-color: rgba(40, 166, 229, 0.9);
    /* Lighter, slightly bluish color */
    transform: scale(1.05);
    /* Slight zoom-in effect */
    box-shadow: 0 6px 15px #00000033;
    /* Enhance shadow for focus */
  }


  .cancel-buttonx:hover {
    background-color: #a81a20;
  }

  /* Style for the buttons */
  .buttonx {
    display: inline-block;
    text-align: center;
    width: 40%;
    height: 80px;
    margin: 10px;
    font: semi-serif;
    color: rgb(240, 235, 235);
    background-color: #4893e3;
    border: none;
    margin-left: 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 95%;
    font-weight: bold;
    /* text-align: center; */
    transition: background-color 0.3s ease;
  }

  .buttonx:hover {
    background-color: rgb(34, 199, 89);
  }
</style>
<div class="init_popup" id="init_popup">
  <div class="signup-containerx" id="signupContainer">
    <!-- Cancel button -->
    <button class="cancel-buttonx" id="cancelSignup" onclick="handelCut()">×</button>

    <h1>WHO YOU ARE?</h1>
    <h6>"you are doctor or patient"</h6>
    <!-- Patient button -->
    <button class="buttonx" id="patientButton" onclick="location.href='patient_signup'">
      Patient signup
    </button>
    <!-- Doctor button -->
    <button class="buttonx" id="doctorButton" onclick="location.href='drSigUp/'">
      Doctor signup
    </button>
  </div>
</div>
<script>
  function handelCut() {
    const signupContainer = document.getElementById("init_popup");
    signupContainer.style.display = "none";
    b.classList.toggle('display_block');
  };

  cancelButton.addEventListener("click", function () {
    setCookie("isOpenForm", "false", 60 * 24); // Save cookie for 1 day
    f.style.display = "none";
    b.classList.remove('display_block');
  });

</script>
